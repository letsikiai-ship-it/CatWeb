<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
      crossorigin="anonymous"
    />
        <title>{%block title%}Catweb{%endblock%}</title>
        <link rel="stylesheet" href="{{url_for('static',filename='dash.css')}}">
    </head>
    <body>
       <div class="d-flex">
            <!-------sidebar-------->
            <div class="bg-dark text-white p-3 signup-container" id="sidebar">
                
                   <div class="bg-dark text-white p-3" id="sidebar">
      <h4 class="mb-4">Menu</h4>
    
      <a class="d-block text-white mb-2" href="/">Log-out</a>
      
    </div>
                
            </div>
            <div class="cont">
                {% with messages = get_flashed_messages(with_categories=true)%}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{'danger' if category == 'error' else 'success'}} alert-dismissable fade show" role="alert">
                        {{message}}
                        <button type="button" class="close" data-dsmiss="alert">
                            <span>&times;</span>
                        </button>
                    </div>
                    {% endfor %}
                {% endif %}
                {% endwith %}   
                {%block content%}{%endblock%}
            </div>
        </div>
    </body>
</html>
